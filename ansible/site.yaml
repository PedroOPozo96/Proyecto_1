- name: Configuración común
  hosts: all
  become: true
  roles:
    - commons

#Base de Datos

- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

# Servidor Web

- name: Servidor web
  hosts: servidores_web
  become: true
  roles:
    - web

# Servidor Docker

- name: Servidor Docker
  hosts: servidores_docker
  become: true
  roles:
    - docker




# Proxy inverso Traefik

- name: Servidor Traefik
  hosts: servidores_docker
  become: true
  roles:
    - traefik


# Portainer en Servidor Docker

- name: Servidor Portainer
  hosts: servidores_docker
  become: true
  roles:
    - portainer


# Servidor NFS
- name: Servidor NFS
  hosts: servidores_web
  become: true
  roles:
    - nfs

