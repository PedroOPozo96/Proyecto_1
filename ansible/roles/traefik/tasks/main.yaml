---
# Red Traefik

- name: Crear red Docker para Traefik
  community.docker.docker_network:
    name: traefik_proxy
    driver: bridge
    state: present


# Directorios Certificados


- name: Crear directorios para certificados y configuración de Traefik
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/traefik/dynamic
    - /etc/traefik/certs


# Certificado HTTPS 

- name: Copiar certificado HTTPS de Portainer
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.local/share/proyecto1/certificados/portainer.crt"
    dest: /etc/traefik/certs/portainer.crt
    owner: root
    group: root
    mode: "0644"

# Clave Privada HTTPS

- name: Copiar clave privada HTTPS de Portainer
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.local/share/proyecto1/certificados/portainer.key"
    dest: /etc/traefik/certs/portainer.key
    owner: root
    group: root
    mode: "0600"



- name: Copiar configuración TLS de Traefik
  ansible.builtin.copy:
    src: tls.yaml
    dest: /etc/traefik/dynamic/tls.yaml
    owner: root
    group: root
    mode: "0644"




- name: Copiar configuración de enrutamiento de Guestbook
  ansible.builtin.copy:
    src: guestbook.yaml
    dest: /etc/traefik/dynamic/guestbook.yaml
    owner: root
    group: root
    mode: "0644"



# Autenticación Dashboard Traefik

- name: Crear directorio para credenciales de Traefik
  ansible.builtin.file:
    path: /etc/traefik/auth
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copiar credenciales del Dashboard
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.local/share/proyecto1/credenciales/traefik-users"
    dest: /etc/traefik/auth/traefik-users
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Copiar configuración del Dashboard
  ansible.builtin.copy:
    src: dashboard.yaml
    dest: /etc/traefik/dynamic/dashboard.yaml
    owner: root
    group: root
    mode: "0644"




# Límite de peticiones Guestbook

- name: Copiar configuración Rate Limiting de Guestbook
  ansible.builtin.copy:
    src: rate-limit.yaml
    dest: /etc/traefik/dynamic/rate-limit.yaml
    owner: root
    group: root
    mode: "0644"




#Rol del contenedor

- name: Desplegar contenedor Traefik
  community.docker.docker_container:
    name: traefik
    image: traefik:v3.7
    state: started
    restart_policy: always
    pull: missing
    published_ports:
      - "80:80"
      - "443:443"
    networks:
      - name: traefik_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/traefik/dynamic:/etc/traefik/dynamic:ro
      - /etc/traefik/certs:/etc/traefik/certs:ro
      - /etc/traefik/auth:/etc/traefik/auth:ro
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik_proxy"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--api.basepath=/traefik"
      - "--accesslog=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

