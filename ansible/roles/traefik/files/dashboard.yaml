---
http:
  routers:
    traefik-dashboard:
      rule: "Host(`portainer.perico.test`) && PathPrefix(`/traefik`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - dashboard-auth
      tls: {}
      priority: 100

  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/auth/traefik-users
